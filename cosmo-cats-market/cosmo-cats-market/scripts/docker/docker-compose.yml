version: '3.8'

networks:
  services:
    name: cluster

services:
  price-mock:
    container_name: price-mock
    build:
      context: ./price-mock
    networks:
      - services
    ports:
      - "8090:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/__admin/requests || exit 1" ]
      start_period: 10s
      interval: 5s
      timeout: 2s
      retries: 3
