databaseChangeLog:
  - changeSet:
      id: add-order-item-table-and-columns
      author: hh
      changes:
        - createSequence:
            sequenceName: order_item_id_seq
            startValue: 1
            incrementBy: 50

        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: price_at_purchase
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_items_order

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_order_items_product

        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: order_number
                  type: VARCHAR(50)
                  constraints:
                    unique: true
              - column:
                  name: customer_email
                  type: VARCHAR(255)
              - column:
                  name: order_date
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(50)

        - sql:
            sql: "UPDATE orders SET order_number = 'ORD-' || id, status = 'PENDING' WHERE order_number IS NULL"

        - addNotNullConstraint:
            tableName: orders
            columnName: order_number
            defaultNullValue: 'TEMP'

        - addNotNullConstraint:
            tableName: orders
            columnName: status
            defaultNullValue: 'PENDING'