databaseChangeLog:
  - changeSet:
      id: lab-3-1
      author: hh
      changes:
        - createSequence:
            sequenceName: category_id_seq
            startValue: 1
            incrementBy: 50
        - createSequence:
            sequenceName: product_id_seq
            startValue: 1
            incrementBy: 50
        - createSequence:
            sequenceName: order_id_seq
            startValue: 1
            incrementBy: 50
        - createSequence:
            sequenceName: cart_id_seq
            startValue: 1
            incrementBy: 50

        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: product
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_product_category

        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: num_product
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: tot_price
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false


        - createTable:
            tableName: cart
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: num_product
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: tot_price
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: cart_id
            referencedTableName: cart
            referencedColumnNames: id
            constraintName: fk_order_cart